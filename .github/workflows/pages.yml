name: فحص ونشر مِيقات
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: miqat-pages
  cancel-in-progress: false
jobs:
  website:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks and tests
        run: |
          node --check assets/app.js
          node --check assets/calendar.js
          node --check scripts/monitor.mjs
          node --test tests/*.test.mjs
      - name: Monitor moon-related official headlines (candidates only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/monitor.mjs
      - name: Store monitored source links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/headlines.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh official-source headline candidates"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
